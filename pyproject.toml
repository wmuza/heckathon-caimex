[project]
name = "mukoti"
version = "0.1.0"
description = "Mukoti: a Shona voice intake line that prepares a triage note for the clinic nurse"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
