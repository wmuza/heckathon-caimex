<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pictogram sheet</title>
<style>
  @font-face { font-family: 'Figtree'; src: url('../web/fonts/figtree-600.ttf'); font-weight: 600; }
  body { margin: 0; font: 600 13px/1.3 'Figtree', sans-serif; }
  .half { padding: 16px 20px 20px; }
  .light { background: #F4F5F7; color: #5B6474; --ink: #1F2430; --accent: #2563EB; --tint: #E8F0FE; --danger: #CF2A30; --paper: #FFFFFF; --quiet: #5B6474; }
  .dark { background: #0B0F17; color: #C3CAD6; --ink: #F3F5F9; --accent: #5B8DEF; --tint: #1B2A4A; --danger: #FF8A8F; --paper: #141A24; --quiet: #C3CAD6; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; }
  figcaption { font-size: 14px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell { width: 100%; aspect-ratio: 1; border-radius: 16px; background: var(--paper); display: grid; place-items: center; }
  .cell svg { width: 86%; height: 86%; }
  .small { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .small .cell { width: 64px; border-radius: 10px; }
</style>
</head>
<body>
<div class="half light"><h1 id="t1"></h1><div class="grid" id="g1"></div><div class="small" id="s1"></div></div>
<div class="half dark"><h1 id="t2"></h1><div class="grid" id="g2"></div></div>
<script>
// A neutral sheet for judging: every entry's pictures at the same size, on the same grounds.
const NAMES = ['welcome','who','age','onset','worse','where','severity','fever','breathing','drinking','vomiting','fits','bleeding','neck','pregnancy','chronic','medicines','allergy','other','listening','thinking','repeat','nurse_coming','wait','recording','not_doctor'];
const q = new URLSearchParams(location.search), entry = q.get('entry'), blind = q.get('blind') === '1';
if (blind) { document.querySelector('.dark').remove(); document.getElementById('s1').remove(); }
document.getElementById('t1').textContent = blind ? 'Pictures 1 to 26' : 'Entry ' + (q.get('label') || entry) + ' · light';
if (!blind) document.getElementById('t2').textContent = 'Entry ' + (q.get('label') || entry) + ' · dark';
(async () => {
  for (const n of NAMES) {
    let svg = '';
    try { const r = await fetch(`entries/${entry}/pictograms/${n}.svg`); if (r.ok) svg = await r.text(); } catch (e) {}
    svg = svg.includes('<svg') ? svg.slice(svg.indexOf('<svg')) : '<span>missing</span>';
    for (const id of blind ? ['g1'] : ['g1', 'g2', 's1']) {
      const f = document.createElement('figure');
      f.innerHTML = `<div class="cell">${svg}</div>` + (id === 's1' ? '' : `<figcaption>${blind ? NAMES.indexOf(n) + 1 : n}</figcaption>`);
      const s = f.querySelector('svg'); if (s) { s.removeAttribute('width'); s.removeAttribute('height'); }
      document.getElementById(id).append(f);
    }
  }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
