<header class="masthead">

    <div class="toolbar">

<main class="container">

      </figure>
      <figure data-name="Thinking">

                  <p class="gloss" lang="en">Thank you. Please take a seat, the nurse will call you.</p>
                </div>
              </div>
              <button class="pill" data-go="0" data-copy="next">Murwere anotevera</button>
            </div>
          </div>
        </article>
      </figure>
      <figure data-name="Nurse coming">

          <div class="phone-head"></div>
          <div class="phone-scroll">

          </div>
        </article>
      </figure>

  </section>

  <section class="library" aria-labelledby="library-title">

<script>
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const copy = {
  sn: {
    welcome: 'Mauya kukiriniki',
    consent: 'Izwi renyu rinorekodhwa kuti mukoti azorinzwa, rozodzimwa mushure mezuva rimwe chete.',
    more: 'Zvimwe',
    notdoctor: 'Mubatsiri uyu ikombiyuta, haasi chiremba. Haakupei mushonga kana zano rekurapwa. Kana zvakaoma, udzai mukoti iye zvino.',
    start: 'Ndinobvuma, tanga kutaura', who: 'Ndiani ari kurwara, imi here kana mwana?',
    speaking: 'Mubatsiri ari kutaura, teererai', listen: 'Taurai iye zvino, ndiri kuteerera',
    mic: 'Maikorofoni', you: 'Imi', heard: 'ndini ndiri kurwara', thinking: 'Ndiri kufunga…',
    yourNumber: 'Nhamba yenyu', done: 'Zvapera', alarmTag: 'Mukoti ari kuuya',
    doneText: 'Ndatenda. Garai muchimirira, mukoti achakudaidzai.',
    alarmText: 'Ndatenda. Mukoti adaidzwa iye zvino. Ndapota garai pano.',
    next: 'Murwere anotevera', progress: 'Mubvunzo 2 pa 6'
  },
  en: {
    welcome: 'Welcome to the clinic',
    consent: 'Your voice is recorded so the nurse can listen to it. It is deleted after one day.',
    more: 'More options',
    notdoctor: 'This helper is a computer, not a doctor. It does not give medicine or medical advice. If it is serious, tell the nurse now.',
    start: 'I agree, start talking', who: 'Who is unwell, you or a child?',
    speaking: 'The helper is speaking, listen', listen: 'Speak now, I am listening',
    mic: 'Microphone', you: 'You', heard: 'It is me who is sick.', thinking: 'Thinking…',
    yourNumber: 'Your number', done: 'Finished', alarmTag: 'The nurse is coming',
    doneText: 'Thank you. Please take a seat, the nurse will call you.',
    alarmText: 'Thank you. The nurse has been called. Please stay here.',
    next: 'Next patient', progress: 'Question 2 of 6'
  }
};

const pictures = {
  questions: {
    who: 'Who is unwell, you or a child?', age: 'How old are you?', onset: 'When did it start?',
    worse: 'Is it getting worse?', where: 'Where is the pain?', severity: 'Is the pain very bad?',
    fever: 'Do you have a fever?', breathing: 'Are you struggling to breathe?',
    drinking: 'Is the child able to drink or breastfeed?', vomiting: 'Are you vomiting?',
    fits: 'Have there been any fits?', bleeding: 'Have you seen any blood?', neck: 'Is your neck stiff?',
    pregnancy: 'Are you pregnant?', chronic: 'Do you have a long-term illness, such as diabetes or high blood pressure?',
    medicines: 'Are you taking any medicines these days?', allergy: 'Is there any medicine that does not agree with you?',
    other: 'Is anything else troubling you?'
  },
  states: {
    welcome: 'What brings you here today?', listening: 'Speak now, I am listening', thinking: 'Thinking…',
    repeat: 'Please say that again, I did not hear you well.', nurse_coming: 'The nurse is coming to you now',
    wait: 'Please take a seat, the nurse will call you', recording: 'Your voice is recorded so the nurse can listen to it',
    not_doctor: 'This helper is a computer, not a doctor'
  }
};

const icon = name => `<svg class="icon ${name}" aria-hidden="true"><use href="#${name}"></use></svg>`;
const choices = $$('.choice');
for (const choice of choices) choice.insertAdjacentHTML('afterbegin', icon('check'));

for (const header of $$('.phone-head')) header.append($('#phone-head').content.cloneNode(true));
for (const track of $$('.progress')) {
  track.innerHTML = [
    `<li aria-label="1"><span class="progress-mark progress-done">${icon('check')}</span></li>`,
    '<li class="is-current" aria-current="step" aria-label="2"><span class="progress-mark progress-current"></span></li>',
    ...[3, 4, 5, 6].map(step => `<li aria-label="${step}"><span class="progress-mark progress-future"></span></li>`)
  ].join('');
}
for (const [group, items] of Object.entries(pictures)) {
  const list = document.getElementById(group);
  for (const [name, caption] of Object.entries(items)) {
    const card = $('#specimen').content.cloneNode(true);
    card.querySelector('figcaption').textContent = caption;
    card.querySelectorAll('use').forEach(use => use.setAttribute('href', '#art-' + name));
    list.append(card);
  }
}

for (const button of $$('[data-language-choice]')) button.addEventListener('click', () => {
  const language = button.dataset.languageChoice;
  const words = copy[language];
  for (const phone of $$('.phone')) {
    phone.lang = language;
    phone.dataset.language = language;
  }
  for (const label of $$('[data-copy]')) label.textContent = words[label.dataset.copy];
  for (const label of $$('[data-copy-label]')) label.setAttribute('aria-label', words[label.dataset.copyLabel]);
  for (const track of $$('.progress')) track.setAttribute('aria-label', words.progress);
  for (const choice of $$('[data-language-choice]')) choice.setAttribute('aria-pressed', choice === button);
});

const matchesDark = matchMedia('(prefers-color-scheme: dark)');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let mode = 'light';
function setTheme() {
  document.documentElement.dataset.theme = mode === 'match' ? (matchesDark.matches ? 'dark' : 'light') : mode;
}
for (const button of $$('[data-mode]')) button.addEventListener('click', () => {
  mode = button.dataset.mode;
  setTheme();
  for (const choice of $$('[data-mode]')) choice.setAttribute('aria-pressed', choice === button);
});
matchesDark.addEventListener('change', setTheme);

const motion = $('#motion');
motion.addEventListener('click', () => {
  const paused = document.documentElement.classList.toggle('motion-paused');
  motion.setAttribute('aria-pressed', paused);
});

const rail = $('.rail');
const frames = [...rail.children];
const previous = $('#previous');
const forward = $('#forward');
let active = 0;
let scrollTarget = null;

function select(index) {
  frames[active].classList.remove('arriving');
  active = index;
  frames[active].classList.add('arriving');
  $('#current-preview').textContent = frames[active].dataset.name;
  previous.disabled = active === 0;
  forward.disabled = active === frames.length - 1;
}

function go(index, fromPhone = false) {
  if (!frames[index]) return;
  select(index);
  const left = frames[index].offsetLeft - frames[0].offsetLeft;
  const end = Math.min(left, rail.scrollWidth - rail.clientWidth);
  const still = reducedMotion.matches || document.documentElement.classList.contains('motion-paused');
  if (Math.abs(rail.scrollLeft - end) > 1) {
    scrollTarget = end;
    rail.scrollTo({ left: end, behavior: still ? 'instant' : 'smooth' });
  }
  if (fromPhone) {
    const phone = frames[index].querySelector('.phone');
    phone.setAttribute('tabindex', '-1');
    phone.focus({ preventScroll: true });
    const top = phone.getBoundingClientRect().top;
    if (top < 0 || top + phone.offsetHeight > innerHeight) {
      window.scrollTo({ top: scrollY + top, behavior: still ? 'instant' : 'smooth' });
    }
  }
}

rail.addEventListener('scroll', () => {
  if (scrollTarget !== null) {
    if (Math.abs(rail.scrollLeft - scrollTarget) < 2) scrollTarget = null;
    return;
  }
  const nearest = frames.findIndex(frame => frame.offsetLeft - frames[0].offsetLeft >= rail.scrollLeft - 2);
  if (nearest >= 0 && nearest !== active) select(nearest);
}, { passive: true });
rail.addEventListener('pointerdown', () => { scrollTarget = null; }, { passive: true });
rail.addEventListener('wheel', () => { scrollTarget = null; }, { passive: true });
rail.addEventListener('keydown', event => {
  if (event.target !== rail || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  go(active + (event.key === 'ArrowRight' ? 1 : -1));
});
previous.addEventListener('click', () => go(active - 1));
forward.addEventListener('click', () => go(active + 1));
for (const button of $$('[data-go]')) button.addEventListener('click', () => go(Number(button.dataset.go), true));
</script>
