<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .drinking-motion {
      animation: drinking-loop 3.6s ease-in-out infinite;
      transform-origin: 148px 108px;
    }
    @keyframes drinking-loop {
      0%, 15%, 100% { transform: rotate(0); }
      55%, 75% { transform: rotate(13deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drinking-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 192v-22q0-21 23-34l17-8 26 8 6 12 22 3 17-39 18 8-13 49q-3 13-17 13h-37v10z" fill="var(--paper, #FFFFFF)"/>
    <path d="M79 116a33 33 0 1 1 56-25l11 10-10 8v10q0 12-13 12h-13" fill="var(--paper, #FFFFFF)"/>
    <path d="M126 92h1"/>
    <g class="drinking-motion">
      <path d="m148 108 52-9-2 38-37 7z" fill="var(--tint, #E8F0FE)"/>
      <path d="m151 108 46-8" stroke="var(--accent, #2563EB)"/>
    </g>
  </g>
</svg>
