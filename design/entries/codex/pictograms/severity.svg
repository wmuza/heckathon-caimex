<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .severity-motion {
      animation: severity-loop 3.2s ease-in-out infinite;
      transform-origin: 120px 78px;
    }
    @keyframes severity-loop {
      0%, 100% { transform: scale(1); }
      45%, 65% { transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .severity-motion { animation: none; }
    }
  </style>
