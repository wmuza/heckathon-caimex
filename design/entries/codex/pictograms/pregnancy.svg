<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .pregnancy-motion {
      animation: pregnancy-loop 3.6s ease-in-out infinite;

    }
    @keyframes pregnancy-loop {
      0%, 100% { transform: translate(0, 0); }
      48%, 70% { transform: translate(3px, -4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pregnancy-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="101" cy="53" r="24" fill="var(--paper, #FFFFFF)"/>
    <path d="M71 199v-75q0-35 32-35 22 0 31 30 9 9 23 13 22 7 22 30 0 32-33 32h-19v5z" fill="var(--paper, #FFFFFF)"/>
    <path d="m87 127 17 30 25 8q9 4 6 11-3 7-13 5l-32-7-14-20"/>
    <path class="pregnancy-motion" d="M158 108q21 5 32 24m-25-40q25 8 40 31" stroke="var(--accent, #2563EB)"/>
  </g>
</svg>
