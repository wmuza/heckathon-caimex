<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .thinking-motion {
      animation: thinking-loop 3.3s ease-in-out infinite;

    }
    @keyframes thinking-loop {
      0%, 100% { transform: translateX(0); }
      51%, 69% { transform: translateX(49px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .thinking-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 65h144q16 0 16 16v63q0 16-16 16h-67l-43 27v-27H48q-16 0-16-16V81q0-16 16-16z" fill="var(--paper, #FFFFFF)"/>
    <path d="M69 113h7l8-17 11 34 10-24 8 7h7" stroke="var(--accent, #2563EB)"/>
    <path d="M136 113h35" stroke="var(--quiet, #5B6474)" stroke-dasharray="1 11"/>
    <circle class="thinking-motion" cx="130" cy="113" r="5" stroke="var(--accent, #2563EB)" fill="var(--accent, #2563EB)"/>
  </g>
</svg>
