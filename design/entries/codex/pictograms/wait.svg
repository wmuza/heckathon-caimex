<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .wait-motion {
      animation: wait-loop 3.6s ease-in-out infinite;

    }
    @keyframes wait-loop {
      0%, 12%, 100% { transform: translateY(-6px); }
      54%, 79% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wait-motion { animation: none; }
    }
  </style>
