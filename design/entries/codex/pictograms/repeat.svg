<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .repeat-motion {
      animation: repeat-loop 3.6s ease-in-out infinite;

    }
    @keyframes repeat-loop {
      0%, 100% { transform: translateX(0); }
      49%, 70% { transform: translateX(-7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .repeat-motion { animation: none; }
    }
  </style>
