<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .welcome-motion {
      animation: welcome-loop 3.3s ease-in-out infinite;
      transform-origin: 78px 172px;
    }
    @keyframes welcome-loop {
      0%, 13%, 100% { transform: rotate(0); }
      35%, 56% { transform: rotate(12deg); }
      73%, 86% { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .welcome-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
