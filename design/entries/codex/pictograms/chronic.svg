    <circle cx="160" cy="151" r="42" fill="var(--paper, #FFFFFF)"/>
    <path d="M133 154a27 27 0 0 1 54 0M160 191v11q0 9 9 9h21" stroke="var(--quiet, #5B6474)"/>
    <path class="chronic-motion" d="m160 154 12-15" stroke="var(--accent, #2563EB)"/>
    <circle cx="160" cy="154" r="4" stroke="var(--accent, #2563EB)" fill="var(--accent, #2563EB)"/>
