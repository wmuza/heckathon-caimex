<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .listening-motion {
      animation: listening-loop 3.2s ease-in-out infinite;
      transform-origin: 120px 0;
    }
    @keyframes listening-loop {
      0%, 100% { transform: scaleX(1); }
      49%, 66% { transform: scaleX(1.16); }
    }
    @media (prefers-reduced-motion: reduce) {
      .listening-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
