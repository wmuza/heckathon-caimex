<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .allergy-no { transform-origin: 120px 120px; animation: allergy-pulse 2.8s ease-in-out infinite; }
    @keyframes allergy-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .allergy-no { animation: none !important; transform: none; }
    }
  </style>
  <g transform="rotate(-35 120 120)">
    <rect x="94" y="72" width="52" height="96" rx="26" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <path d="M94 120V98a26 26 0 0 1 52 0v22z" fill="var(--tint, #E8F0FE)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
  </g>
  <g class="allergy-no" stroke="var(--danger, #CF2A30)" stroke-width="8" stroke-linecap="round">
    <circle cx="120" cy="120" r="68" fill="none"/>
    <path d="M74 74l92 92"/>
  </g>
</svg>
