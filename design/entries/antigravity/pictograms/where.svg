<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .where-target { animation: where-scan 3.6s ease-in-out infinite; }
    .where-ring { animation: where-pulse 1.8s ease-out infinite; transform-origin: 120px 128px; }
    @keyframes where-scan {
      0%, 100% { transform: translateY(-60px); }
      35% { transform: translateY(-10px); }
      70% { transform: translateY(34px); }
    }
    @keyframes where-pulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .where-target, .where-ring { animation: none !important; transform: none; opacity: 1; }
    }
  </style>
  <g stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="64" r="24" fill="var(--paper, #FFFFFF)"/>
    <path d="M68 198v-54c0-26 22-44 52-44s52 18 52 44v54" fill="var(--paper, #FFFFFF)"/>
    <path d="M90 144v54M150 144v54" fill="none"/>
  </g>
  <g class="where-target">
    <circle class="where-ring" cx="120" cy="128" r="22" fill="none" stroke="var(--danger, #CF2A30)" stroke-width="5"/>
    <circle cx="120" cy="128" r="18" fill="var(--paper, #FFFFFF)" stroke="var(--danger, #CF2A30)" stroke-width="6"/>
    <circle cx="120" cy="128" r="7" fill="var(--danger, #CF2A30)"/>
  </g>
</svg>
