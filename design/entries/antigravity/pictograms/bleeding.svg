<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .bleeding-small { animation: bleeding-fall 2.6s ease-in-out infinite; }
    .bleeding-ring { transform-origin: 120px 186px; animation: bleeding-ripple 2.6s ease-out infinite; }
    @keyframes bleeding-fall {
      0% { transform: translateY(-10px); opacity: 0; }
      25% { opacity: 1; }
      60% { transform: translateY(24px); opacity: 1; }
      75%, 100% { transform: translateY(34px); opacity: 0; }
    }
    @keyframes bleeding-ripple {
      0%, 50% { transform: scale(0.75); opacity: 0; }
      65% { opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bleeding-small, .bleeding-ring { animation: none !important; transform: none; opacity: 1; }
    }
  </style>
  <ellipse class="bleeding-ring" cx="120" cy="186" rx="54" ry="14" fill="none" stroke="var(--danger, #CF2A30)" stroke-width="5"/>
  <ellipse cx="120" cy="186" rx="34" ry="9" fill="var(--danger, #CF2A30)" fill-opacity="0.22" stroke="var(--danger, #CF2A30)" stroke-width="5"/>
  <path d="M120 58c0 0-38 48-38 76a38 38 0 0 0 76 0c0-28-38-76-38-76z" fill="var(--danger, #CF2A30)" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M104 138a18 18 0 0 0 14 18" fill="none" stroke="var(--paper, #FFFFFF)" stroke-width="6" stroke-linecap="round"/>
  <path class="bleeding-small" d="M120 26c0 0-10 14-10 21a10 10 0 0 0 20 0c0-7-10-21-10-21z" fill="var(--danger, #CF2A30)"/>
</svg>
