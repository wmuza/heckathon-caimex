<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .medicines-cap { animation: medicines-float 3.2s ease-in-out infinite; }
    .medicines-tab { animation: medicines-bob 3.2s ease-in-out infinite 0.5s; }
    @keyframes medicines-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-3deg); }
    }
    @keyframes medicines-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .medicines-cap, .medicines-tab { animation: none !important; transform: none; }
    }
  </style>
  <circle cx="120" cy="120" r="76" fill="var(--tint, #E8F0FE)"/>
  <g class="medicines-cap" transform="rotate(-35 96 112)">
    <rect x="68" y="64" width="56" height="96" rx="28" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <path d="M68 112V92a28 28 0 0 1 56 0v20z" fill="var(--accent, #2563EB)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
  </g>
  <g class="medicines-tab">
    <circle cx="164" cy="154" r="28" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <path d="M146 142l36 24" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
