<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .age-f1 { animation: age-glow 3.6s ease-in-out infinite 0s; }
    .age-f2 { animation: age-glow 3.6s ease-in-out infinite 1.2s; }
    .age-f3 { animation: age-glow 3.6s ease-in-out infinite 2.4s; }
    .age-arc { stroke-dasharray: 210; animation: age-trace 3.6s ease-in-out infinite; }
    @keyframes age-glow {
      0%, 100% { fill: var(--paper, #FFFFFF); }
      20%, 35% { fill: var(--tint, #E8F0FE); }
    }
    @keyframes age-trace {
      0% { stroke-dashoffset: 210; opacity: 0.4; }
      55%, 85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .age-f1, .age-f2, .age-f3, .age-arc { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <path class="age-arc" d="M46 104Q108 34 176 38" fill="none" stroke="var(--accent, #2563EB)" stroke-width="6" stroke-linecap="round"/>
  <path d="M166 29l13 9-11 11" fill="none" stroke="var(--accent, #2563EB)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 192h180" stroke="var(--quiet, #5B6474)" stroke-width="6" stroke-linecap="round"/>
  <g stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle class="age-f1" cx="54" cy="144" r="12" fill="var(--paper, #FFFFFF)"/>
    <path class="age-f1" d="M36 192v-16c0-10 8-17 18-17s18 7 18 17v16z" fill="var(--paper, #FFFFFF)"/>
    <circle class="age-f2" cx="112" cy="114" r="15" fill="var(--paper, #FFFFFF)"/>
    <path class="age-f2" d="M89 192v-36c0-13 10-22 23-22s23 9 23 22v36z" fill="var(--paper, #FFFFFF)"/>
    <circle class="age-f3" cx="178" cy="78" r="19" fill="var(--paper, #FFFFFF)"/>
    <path class="age-f3" d="M148 192v-56c0-17 13-29 30-29s30 12 30 29v56z" fill="var(--paper, #FFFFFF)"/>
  </g>
</svg>
