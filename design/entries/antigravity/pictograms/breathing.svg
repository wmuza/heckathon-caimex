<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .breathing-l { transform-origin: 108px 134px; animation: breathing-lung 2.6s ease-in-out infinite; }
    .breathing-r { transform-origin: 132px 134px; animation: breathing-lung 2.6s ease-in-out infinite; }
    .breathing-tight { animation: breathing-press 2.6s ease-in-out infinite; }
    @keyframes breathing-lung {
      0%, 100% { transform: scale(0.92); }
      35% { transform: scale(1.03); }
      55% { transform: scale(0.94); }
      75% { transform: scale(1.02); }
    }
    @keyframes breathing-press {
      0%, 100% { transform: translateX(0); opacity: 0.55; }
      50% { transform: translateX(4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .breathing-l, .breathing-r, .breathing-tight { animation: none !important; transform: none; opacity: 1; }
    }
  </style>
  <circle cx="120" cy="48" r="18" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
  <path d="M56 198v-68c0-26 24-44 64-44s64 18 64 44v68z" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M120 84v24m0 0l-14 14m14-14l14 14" fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round"/>
  <path class="breathing-l" d="M110 118c-16 0-30 16-30 40 0 12 8 20 20 20 8 0 12-6 12-16v-36c0-5-1-8-2-8z" fill="var(--tint, #E8F0FE)" stroke="var(--accent, #2563EB)" stroke-width="6" stroke-linejoin="round"/>
  <path class="breathing-r" d="M130 118c16 0 30 16 30 40 0 12-8 20-20 20-8 0-12-6-12-16v-36c0-5 1-8 2-8z" fill="var(--tint, #E8F0FE)" stroke="var(--accent, #2563EB)" stroke-width="6" stroke-linejoin="round"/>
  <g class="breathing-tight" fill="none" stroke="var(--danger, #CF2A30)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 128l14 12-14 12"/>
    <path d="M204 128l-14 12 14 12"/>
  </g>
</svg>
