<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .thinking-d1 { animation: thinking-hop 2.4s ease-in-out infinite 0s; }
    .thinking-d2 { animation: thinking-hop 2.4s ease-in-out infinite 0.35s; }
    .thinking-d3 { animation: thinking-hop 2.4s ease-in-out infinite 0.7s; }
    .thinking-bubble { animation: thinking-float 3.2s ease-in-out infinite; }
    @keyframes thinking-hop {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes thinking-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .thinking-d1, .thinking-d2, .thinking-d3, .thinking-bubble { animation: none !important; transform: none; opacity: 1; }
    }
  </style>
  <circle cx="120" cy="112" r="76" fill="var(--tint, #E8F0FE)"/>
  <g class="thinking-bubble">
    <rect x="44" y="64" width="152" height="92" rx="46" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <circle cx="80" cy="174" r="10" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <circle cx="62" cy="194" r="6" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
    <circle class="thinking-d1" cx="88" cy="110" r="8" fill="var(--accent, #2563EB)"/>
    <circle class="thinking-d2" cx="120" cy="110" r="8" fill="var(--accent, #2563EB)"/>
    <circle class="thinking-d3" cx="152" cy="110" r="8" fill="var(--accent, #2563EB)"/>
  </g>
</svg>
