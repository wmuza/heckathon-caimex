<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .not_doctor-v1 { transform-origin: 86px 116px; animation: not_doctor-bar 2.4s ease-in-out infinite 0s; }
    .not_doctor-v2 { transform-origin: 102px 116px; animation: not_doctor-bar 2.4s ease-in-out infinite 0.3s; }
    .not_doctor-v3 { transform-origin: 118px 116px; animation: not_doctor-bar 2.4s ease-in-out infinite 0.6s; }
    @keyframes not_doctor-bar {
      0%, 100% { transform: scaleY(0.65); }
      50% { transform: scaleY(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .not_doctor-v1, .not_doctor-v2, .not_doctor-v3 { animation: none !important; transform: none; }
    }
  </style>
  <rect x="44" y="54" width="116" height="136" rx="22" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6"/>
