<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .fever-merc { transform-origin: 170px 168px; animation: fever-rise 3.0s ease-in-out infinite; }
    .fever-wave { animation: fever-heat 3.0s ease-in-out infinite; }
    @keyframes fever-rise {
      0%, 100% { transform: scaleY(0.55); }
      55%, 75% { transform: scaleY(1); }
    }
    @keyframes fever-heat {
      0%, 100% { transform: translateY(4px); opacity: 0.45; }
      55% { transform: translateY(-6px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fever-merc, .fever-wave { animation: none !important; transform: none; opacity: 1; }
    }
  </style>
  <g class="fever-wave" fill="none" stroke="var(--danger, #CF2A30)" stroke-width="6" stroke-linecap="round">
    <path d="M62 64c-6-8 6-16 0-24"/>
    <path d="M88 60c-6-8 6-16 0-24"/>
    <path d="M114 64c-6-8 6-16 0-24"/>
  </g>
  <g stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="88" cy="108" r="25" fill="var(--paper, #FFFFFF)"/>
    <path d="M44 196v-26c0-20 19-34 44-34s44 14 44 34v26z" fill="var(--paper, #FFFFFF)"/>
  </g>
  <path d="M158 58a12 12 0 0 1 24 0v88a24 24 0 1 1-24 0z" fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linejoin="round"/>
  <rect class="fever-merc" x="165" y="72" width="10" height="96" rx="5" fill="var(--danger, #CF2A30)"/>
  <circle cx="170" cy="168" r="14" fill="var(--danger, #CF2A30)"/>
</svg>
