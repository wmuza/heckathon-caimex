<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.severity-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.severity-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.severity-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.severity-fill{fill:var(--accent,#2563EB)}.severity-tint{fill:var(--tint,#E8F0FE)}.severity-hot{fill:var(--danger,#CF2A30)}.severity-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.severity-ray{opacity:1}
.severity-move{animation:severity-pulse 2.8s ease-in-out infinite}
@keyframes severity-pulse{0%,18%{opacity:1}48%{opacity:.3}78%,100%{opacity:1}}

@media (prefers-reduced-motion:reduce){.severity-move{animation:none}}
</style>
