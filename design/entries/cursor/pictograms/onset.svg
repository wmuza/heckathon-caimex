<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.onset-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.onset-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.onset-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.onset-fill{fill:var(--accent,#2563EB)}.onset-tint{fill:var(--tint,#E8F0FE)}.onset-hot{fill:var(--danger,#CF2A30)}.onset-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.onset-s2,.onset-s3{opacity:0}
.onset-s1{animation:onset-1 3.6s ease-in-out infinite}
.onset-s2{animation:onset-2 3.6s ease-in-out infinite}
.onset-s3{animation:onset-3 3.6s ease-in-out infinite}
@keyframes onset-1{0%,18%{opacity:1}32%,88%{opacity:0}100%{opacity:1}}
@keyframes onset-2{0%,18%{opacity:0}32%,52%{opacity:1}66%,100%{opacity:0}}
@keyframes onset-3{0%,52%{opacity:0}66%,82%{opacity:1}96%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){.onset-move{animation:none}}
</style>

