<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.fever-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fever-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fever-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fever-fill{fill:var(--accent,#2563EB)}.fever-tint{fill:var(--tint,#E8F0FE)}.fever-hot{fill:var(--danger,#CF2A30)}.fever-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fever-col{transform-box:fill-box;transform-origin:50% 100%;animation:fever-rise 3.2s ease-in-out infinite}
.fever-w1,.fever-w2,.fever-w3{opacity:.35;animation:fever-heat 3.2s ease-in-out infinite}
.fever-w2{animation-delay:-1.1s}
.fever-w3{animation-delay:-2.1s}
@keyframes fever-rise{0%,14%{transform:scaleY(.22)}55%,78%{transform:scaleY(1)}100%{transform:scaleY(.22)}}
@keyframes fever-heat{0%,100%{opacity:.25}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){.fever-move{animation:none}}
</style>
<path class="fever-body" d="M48 200V109C48 90 108 90 108 109V200Z"/><circle class="fever-body" cx="78" cy="78" r="22"/><path class="fever-ray fever-move fever-w1" d="M86 36q16-14 32 0"/><path class="fever-ray fever-move fever-w2" d="M78 22q24-16 48 0"/><path class="fever-ray fever-move fever-w3" d="M96 10q10-8 20 0"/>
<circle class="fever-fill" cx="176" cy="176" r="18"/>
<rect class="fever-line" x="158" y="36" width="36" height="146" rx="18"/>
<rect class="fever-fill fever-col fever-move" x="170" y="70" width="12" height="100" rx="6"/>

</svg>
