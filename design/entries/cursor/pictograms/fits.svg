<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.fits-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fits-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fits-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.fits-fill{fill:var(--accent,#2563EB)}.fits-tint{fill:var(--tint,#E8F0FE)}.fits-hot{fill:var(--danger,#CF2A30)}.fits-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fits-arm{transform-box:fill-box;transform-origin:100% 100%;animation:fits-rock 2.4s ease-in-out infinite}
.fits-leg{transform-box:fill-box;transform-origin:0% 40%;animation:fits-rock 2.4s ease-in-out infinite;animation-delay:-1.2s}
@keyframes fits-rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}

@media (prefers-reduced-motion:reduce){.fits-move{animation:none}}
</style>

<path class="fits-line" d="M24 176H216"/>
<rect class="fits-body" x="78" y="128" width="108" height="44" rx="22"/>
<circle class="fits-body" cx="64" cy="150" r="24"/>
<path class="fits-line fits-arm fits-move" d="M118 136L86 96"/>
<path class="fits-line fits-leg fits-move" d="M176 160l26 8 6 24"/>

</svg>
