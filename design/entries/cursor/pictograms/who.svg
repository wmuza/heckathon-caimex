<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.who-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.who-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.who-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.who-fill{fill:var(--accent,#2563EB)}.who-tint{fill:var(--tint,#E8F0FE)}.who-hot{fill:var(--danger,#CF2A30)}.who-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.who-a,.who-b{opacity:1}
.who-move{animation:who-pick 3.2s ease-in-out infinite}
.who-b{animation-delay:-1.6s}
@keyframes who-pick{0%,36%{opacity:1}50%,86%{opacity:.15}100%{opacity:1}}

@media (prefers-reduced-motion:reduce){.who-move{animation:none}}
</style>
<path class="who-line" d="M28 206H212"/>
<circle class="who-ray who-move who-a" cx="76" cy="72" r="36"/>
<circle class="who-ray who-move who-b" cx="170" cy="116" r="28"/>
<path class="who-body" d="M46 198V103C46 84 106 84 106 103V198Z"/><circle class="who-body" cx="76" cy="72" r="22"/><path class="who-body" d="M148 198V142C148 124 192 124 192 142V198Z"/><circle class="who-body" cx="170" cy="116" r="15"/>
</svg>
