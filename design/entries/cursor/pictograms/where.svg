<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.where-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.where-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.where-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.where-fill{fill:var(--accent,#2563EB)}.where-tint{fill:var(--tint,#E8F0FE)}.where-hot{fill:var(--danger,#CF2A30)}.where-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.where-s1,.where-s2,.where-s3{opacity:1}
.where-s1{animation:where-1 3.6s ease-in-out infinite}
.where-s2{animation:where-2 3.6s ease-in-out infinite}
.where-s3{animation:where-3 3.6s ease-in-out infinite}
@keyframes where-1{0%,22%{opacity:1}34%,100%{opacity:.2}}
@keyframes where-2{0%,22%{opacity:.2}34%,56%{opacity:1}68%,100%{opacity:.2}}
@keyframes where-3{0%,56%{opacity:.2}68%,90%{opacity:1}100%{opacity:.2}}

@media (prefers-reduced-motion:reduce){.where-move{animation:none}}
</style>
