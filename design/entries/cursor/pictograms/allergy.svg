<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
<style>
.allergy-line{fill:none;stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.allergy-body{fill:var(--paper,#FFFFFF);stroke:var(--ink,#1F2430);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.allergy-ray{fill:none;stroke:var(--accent,#2563EB);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.allergy-fill{fill:var(--accent,#2563EB)}.allergy-tint{fill:var(--tint,#E8F0FE)}.allergy-hot{fill:var(--danger,#CF2A30)}.allergy-quiet{fill:none;stroke:var(--quiet,#5B6474);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.allergy-s1,.allergy-s2,.allergy-s3,.allergy-s4{opacity:1}
.allergy-s1{animation:allergy-1 3.2s ease-in-out infinite}
.allergy-s2{animation:allergy-2 3.2s ease-in-out infinite}
.allergy-s3{animation:allergy-3 3.2s ease-in-out infinite}
.allergy-s4{animation:allergy-4 3.2s ease-in-out infinite}
@keyframes allergy-1{0%,18%{opacity:1}30%,88%{opacity:.15}100%{opacity:1}}
@keyframes allergy-2{0%,18%{opacity:.15}30%,48%{opacity:1}60%,100%{opacity:.15}}
@keyframes allergy-3{0%,42%{opacity:.15}54%,72%{opacity:1}84%,100%{opacity:.15}}
@keyframes allergy-4{0%,66%{opacity:.15}78%,92%{opacity:1}100%{opacity:.15}}

@media (prefers-reduced-motion:reduce){.allergy-move{animation:none}}
</style>

<rect class="allergy-body" x="28" y="86" width="140" height="44" rx="22"/>
<circle class="allergy-body" cx="178" cy="108" r="22"/>
<circle class="allergy-fill allergy-move allergy-s1" cx="62" cy="108" r="7"/><circle class="allergy-fill allergy-move allergy-s2" cx="92" cy="108" r="7"/><circle class="allergy-fill allergy-move allergy-s3" cx="122" cy="108" r="7"/><circle class="allergy-fill allergy-move allergy-s4" cx="150" cy="108" r="7"/><g transform="translate(24 18)"><path class="allergy-fill" d="M4 29V17A13 13 0 0 1 30 17V29Z"/><rect class="allergy-line" x="0" y="0" width="34" height="58" rx="17.0"/></g>
</svg>
