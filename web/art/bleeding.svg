<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .bleeding-motion {
      animation: bleeding-loop 3.4s ease-in-out infinite;

    }
    @keyframes bleeding-loop {
      0%, 15%, 100% { transform: translateY(0); }
      60%, 80% { transform: translateY(12px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bleeding-motion { animation: none; }
    }
  </style>
