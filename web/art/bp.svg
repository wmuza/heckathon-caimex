<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .bp-needle { transform-origin: 176px 86px; animation: bp-rise 4s ease-in-out infinite; }
    .bp-bulb { transform-origin: 62px 196px; animation: bp-squeeze 4s ease-in-out infinite; }
    @keyframes bp-rise {
      0%, 10% { transform: rotate(-70deg); }
      45%, 60% { transform: rotate(40deg); }
      90%, 100% { transform: rotate(-10deg); }
    }
    @keyframes bp-squeeze {
      0%, 10%, 22%, 34%, 46%, 100% { transform: scale(1); }
      16%, 28%, 40% { transform: scale(0.86); }
    }
    @media (prefers-reduced-motion: reduce) { .bp-needle { animation: none; transform: rotate(-10deg); } .bp-bulb { animation: none; } }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 118q10-34 44-34h52q16 0 30 14l26 30q8 10-2 18t-20-2l-22-20v16H50q-28 0-28-22z" fill="var(--paper, #FFFFFF)"/>
    <rect x="56" y="74" width="52" height="80" rx="12" fill="var(--tint, #E8F0FE)" stroke="var(--accent, #2563EB)"/>
    <path d="M82 154q0 30-20 30" stroke="var(--quiet, #5B6474)" stroke-width="5"/>
    <ellipse class="bp-bulb" cx="62" cy="196" rx="20" ry="13" fill="var(--paper, #FFFFFF)"/>
    <path d="M108 100q24-6 38-14" stroke="var(--quiet, #5B6474)" stroke-width="5"/>
    <circle cx="176" cy="86" r="34" fill="var(--paper, #FFFFFF)"/>
    <path d="M176 60v5M154 74l4 3M198 74l-4 3" stroke="var(--quiet, #5B6474)" stroke-width="4"/>
    <path class="bp-needle" d="M176 86v-22" stroke="var(--accent, #2563EB)" stroke-width="6"/>
    <circle cx="176" cy="86" r="4" fill="var(--accent, #2563EB)" stroke="none"/>
  </g>
</svg>
