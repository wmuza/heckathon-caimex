<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .allergy-motion {
      animation: allergy-loop 3.2s ease-in-out infinite;
      transform-origin: 99px 161px;
    }
    @keyframes allergy-loop {
      0%, 100% { transform: scale(1); }
      47%, 69% { transform: scale(1.14); }
