<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .weight-needle { transform-origin: 120px 152px; animation: weight-settle 4s ease-in-out infinite; }
    @keyframes weight-settle {
      0%, 12% { transform: rotate(-58deg); }
      40% { transform: rotate(34deg); }
      55% { transform: rotate(14deg); }
      68%, 100% { transform: rotate(22deg); }
    }
    @media (prefers-reduced-motion: reduce) { .weight-needle { animation: none; transform: rotate(22deg); } }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g fill="var(--paper, #FFFFFF)">
      <circle cx="120" cy="46" r="17"/>
      <path d="M92 118V92q0-22 28-22t28 22v26z"/>
      <rect x="42" y="118" width="156" height="96" rx="20"/>
    </g>
    <path d="M80 174a40 40 0 0 1 80 0z" fill="var(--tint, #E8F0FE)"/>
    <path d="M120 140v6M96 150l4 5M144 150l-4 5" stroke="var(--quiet, #5B6474)" stroke-width="5"/>
    <path class="weight-needle" d="M120 172v-28" stroke="var(--accent, #2563EB)" stroke-width="7"/>
    <circle cx="120" cy="172" r="5" fill="var(--accent, #2563EB)" stroke="none"/>
    <path d="M60 196h120" stroke="var(--quiet, #5B6474)" stroke-width="5"/>
  </g>
</svg>
