<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .age-motion {
      animation: age-loop 3.5s ease-in-out infinite;

    }
    @keyframes age-loop {
      0%, 18%, 100% { transform: translate(0, 0); }
      58%, 78% { transform: translate(6px, -5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .age-motion { animation: none; }
    }
  </style>
  <g fill="none" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
