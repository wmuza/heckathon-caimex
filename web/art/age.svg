      <path d="M147 190v-63q0-29 31-29t31 29v63z"/>
    </g>
    <path d="M24 190h188"/>
    <path class="age-motion" d="M44 88q39-7 70-39m-23 4 23-4-5 22" stroke="var(--accent, #2563EB)"/>
