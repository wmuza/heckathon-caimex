<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <style>
    .thinking-dot { animation: thinking-light 3.6s ease-in-out infinite; }
    .thinking-middle { animation-delay: -2.4s; }
    .thinking-last { animation-delay: -1.2s; }
    @keyframes thinking-light {
      0%, 13%, 100% { fill: var(--accent, #2563EB); stroke: var(--accent, #2563EB); }
      28%, 88% { fill: var(--paper, #FFFFFF); stroke: var(--quiet, #5B6474); }
    }
    @media (prefers-reduced-motion: reduce) {
      .thinking-dot { animation: none; }
    }
  </style>
  <path d="M48 65h144q16 0 16 16v63q0 16-16 16h-67l-43 27v-27H48q-16 0-16-16V81q0-16 16-16z"
    fill="var(--paper, #FFFFFF)" stroke="var(--ink, #1F2430)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="var(--accent, #2563EB)" stroke="var(--accent, #2563EB)" stroke-width="6">
    <circle class="thinking-dot" cx="82" cy="113" r="7"/>
    <circle class="thinking-dot thinking-middle" cx="120" cy="113" r="7"/>
    <circle class="thinking-dot thinking-last" cx="158" cy="113" r="7"/>
  </g>
</svg>
